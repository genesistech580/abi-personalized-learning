{% extends "base.html" %}
{% block content %}
<section class="panel form-panel">
    <h1>Reset password</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Send reset link</button>
        <a href="{% url 'login' %}">Back to sign in</a>
    </form>
</section>
{% endblock %}
