{% if topic.series %}<figure class="topic-chart"><figcaption>{{ topic.name }} · Comparable attempt scores</figcaption><svg viewBox="0 0 590 175" role="img" aria-label="{{ topic.name }} scores over comparable attempts"><line x1="45" y1="25" x2="45" y2="140" stroke="#8b98ab"/><line x1="45" y1="140" x2="550" y2="140" stroke="#8b98ab"/><text x="2" y="30">100%</text><text x="8" y="145">0%</text><polyline points="{{ topic.chart_line }}" fill="none" stroke="#15396b" stroke-width="3"/>{% for point in topic.series %}<circle cx="{{ point.x }}" cy="{{ point.y }}" r="4" fill="#b01832"><title>{{ point.stage }}: {{ point.score|floatformat:1 }}%</title></circle><text x="{{ point.x }}" y="165" text-anchor="middle">{{ point.label }}</text>{% endfor %}</svg><details><summary>Score data</summary><ul>{% for point in topic.series %}<li>Attempt {{ point.label }} · {{ point.stage }} · {{ point.date|date:"M j, Y H:i" }} · {{ point.score|floatformat:1 }}%</li>{% endfor %}</ul></details></figure>{% endif %}
