{% extends "base.html" %}
{% block title %}{{ title }} | ABI's AI-Powered Personalized Learning{% endblock %}
{% block content %}
<article class="panel form-panel">
    <h1>{{ title }}</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
        <a href="{% url 'dashboard' %}">Cancel</a>
    </form>
</article>
{% endblock %}
