{% extends "base.html" %}
{% block content %}
<section class="panel form-panel">
    <h1>Deactivate {{ account.get_role_display|lower }}</h1>
    <p>{{ account.username }}</p>
    <p>Access will be disabled. Learning records and course assignments will be retained.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Deactivate account</button>
        <a href="{% url 'dashboard' %}?section=people">Cancel</a>
    </form>
</section>
{% endblock %}
