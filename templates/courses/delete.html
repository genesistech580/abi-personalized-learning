{% extends "base.html" %}
{% block content %}
<article class="panel form-panel">
    <h1>Archive course</h1>
    <p><strong>{{ course }}</strong></p>
    <p>This closes student access. Lessons, enrollments and results will be retained.</p>
    <form method="post">
        {% csrf_token %}
        <button class="danger-button" type="submit">Archive course</button>
        <a href="{% url 'dashboard' %}">Cancel</a>
    </form>
</article>
{% endblock %}
